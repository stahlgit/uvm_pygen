# ============================================================================
# UVM Verification Environment Configuration
# ============================================================================
verification:
  project_name: "ALU Functional Verification"
  dut_config: "config_dut.yaml"
  testbench_name: "single_testbench"

env:
  name: alu_env
  reference_model:
    strategy: ap_subscriber
    implementation: sv_class
    connects:
      - from: agent.driver.ap
        to: reference_model.analysis_export
        transaction: AluTransaction
      - from: agent.monitor.ap
        to: reference_model.analysis_export
        transaction: AluTransaction
      - from: agent.monitor.ap
        to: scoreboard.actual_export
        transaction: AluTransaction
      - from: reference_model.ap_expected
        to: scoreboard.expected_export
        transaction: AluTransaction

  interfaces:
    - name: AluInterface
      ports: ["Control Signals", ACT, OP, MOVI, REG_A, REG_B, MEM, IMM, EX_ALU_VLD, EX_ALU, ALU_RDY]

  agents:
    - name: agent
      mode: active
      interface: AluInterface
      transaction: AluTransaction
      components:
      - driver
      - sequencer
      - monitor

transactions:
  - name: AluTransaction
    field_overrides:
      - name: rst
        randomize: false
        default: 0
      - name: act
        randomize: true
        default: 1
