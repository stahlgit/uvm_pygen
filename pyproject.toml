[project]
name = "uvm-pygen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "merge3>=0.0.16",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
exclude = ["build", "dist", ".venv", "lib", "tools"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "D", "I", "UP", "C90", "TID", "PL", "SIM", "PT", "B", "A", "DTZ"]
ignore = ["F403", "E501", "PLR0913", "D100", "D205", "D212", "D415", "D400"]

# Docstring style (Google)
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
follow_imports = "normal"
show_error_codes = true
pretty = true
exclude = "lib/|venv/|tools/|doc/"


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
